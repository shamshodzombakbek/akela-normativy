name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop_sync/**"
      - "bitrix_*.py"
      - "shared_store.py"
      - "google_store.py"
      - "schedule.py"
      - "utils.py"
      - "requirements*.txt"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build exe
        run: pyinstaller --noconfirm desktop_sync/AkelaNormativSync.spec

      - name: Pack release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/AkelaNormativSync.exe release/
          Copy-Item scripts/install_windows_autostart.bat release/
          Copy-Item desktop_sync/README.txt release/
          Compress-Archive -Path release/* -DestinationPath AkelaNormativSync-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkelaNormativSync-Windows
          path: AkelaNormativSync-Windows.zip
          retention-days: 90
